# =====================================================================
#  Montage local : l'application et sa base.
#
#     docker compose up --build
#
#  Pour un poste de developpement uniquement. En production, la base est
#  un service gere et seule l'image applicative est deployee.
# =====================================================================
services:
  base:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flotte
      POSTGRES_PASSWORD: flotte
      POSTGRES_DB: flotte
    volumes:
      - donnees-base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotte"]
      interval: 5s
      timeout: 3s
      retries: 20

  application:
    build: .
    depends_on:
      base:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Africa/Casablanca
      PORT: 3000
      DATABASE_URL: postgresql://flotte:flotte@base:5432/flotte
      DATABASE_SSL: "off"
      ALLOWED_ORIGINS: http://localhost:3000
      SECURE_COOKIES: "false"
      ENABLE_HSTS: "false"
      TRUST_PROXY: "false"
      # A remplacer : « npm run keygen » les genere.
      APP_SECRET: ${APP_SECRET:?renseignez APP_SECRET}
      APP_PASSWORD_PEPPER: ${APP_PASSWORD_PEPPER:?renseignez APP_PASSWORD_PEPPER}
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?renseignez BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      # L'ancre du journal d'audit doit survivre aux redemarrages.
      - donnees-app:/app/data

volumes:
  donnees-base:
  donnees-app:
